name: Local regression checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tools/check-ui-refresh.cjs
      - run: node tools/check-auto-sync.cjs
      - run: node tools/check-sync-write.cjs
      - run: node tools/check-editor-draft.cjs
